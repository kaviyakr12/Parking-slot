<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Parking Slot Allocation System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Smart Parking Slot Allocation System</h1>

<link rel="stylesheet" href="style.css">
<div>
  <label>City:</label>
  <select id="city" onchange="loadAreas()">
    <option value="">Select City</option>
    <option>Chennai</option>
    <option>Coimbatore</option>
    <option>Bangalore</option>
    <option>Mumbai</option>
    <option>Delhi</option>
    <option>Hyderabad</option>
    <option>Pune</option>
    <option>Kolkata</option>
  </select>
  <label>Area:</label>
  <select id="area"></select>
</div>

<div id="slotSection" style="display:none;">
  <h2>Parking Slots</h2>
  <div class="slot-container" id="slots"></div>
</div>

<div id="bookingForm">
  <h3 id="formTitle">Book Slot</h3>
  <input id="name" placeholder="Name"><br>
  <input id="Vehicle Type" placeholder="Vehicle Type"><br>
  <input id="time" type="number" min="1" placeholder="Enter time in minutes"><br>
  <button id="bookBtn" onclick="confirmBooking()">Confirm Booking</button>
  <button id="takeVehicleBn" onclick="takeVehicle()" style="display:none;">Take Vehicle & Pay</button>
</div>

<script src="script.js"></script>
</body>
</html>
